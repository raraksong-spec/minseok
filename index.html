<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리학교 분실물 찾기 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 glass-header border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-box-archive"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-900">학교 분실물 찾기</h1>
                    <p class="text-xs text-slate-500 mt-1">학생부 & 교무실 통합 분실물 센터</p>
                </div>
            </div>
            <button onclick="window.openRegisterModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition duration-200 shadow-sm hover:shadow-md flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>분실물 등록</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-4 mt-6">
        
        <!-- Search & Filter Controls -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="window.renderItems()" placeholder="분실물 명칭, 습득 장소 검색..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>
            
            <div class="flex gap-2">
                <select id="categoryFilter" onchange="window.renderItems()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">전체 카테고리</option>
                    <option value="전자기기">📱 전자기기</option>
                    <option value="의류/잡화">👕 의류/잡화</option>
                    <option value="학용품/도서">✏️ 학용품/도서</option>
                    <option value="기타">🎁 기타</option>
                </select>

                <select id="keeperFilter" onchange="window.renderItems()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">전체 보관처</option>
                    <option value="1학년 교무실">1학년 교무실</option>
                    <option value="2학년 교무실">2학년 교무실</option>
                    <option value="3학년 교무실">3학년 교무실</option>
                    <option value="본 교무실">본 교무실</option>
                    <option value="학생부">학생부</option>
                    <option value="행정실">행정실</option>
                </select>
            </div>
        </div>

        <!-- Items Cards Grid Container -->
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Items rendered dynamically via JavaScript -->
        </div>

        <!-- Empty State UI -->
        <div id="emptyState" class="hidden py-16 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="font-bold text-slate-700 text-lg">등록된 분실물이 없습니다</h3>
            <p class="text-sm text-slate-500 mt-1">분실물을 습득하셨다면 상단의 등록 버튼을 눌러주세요.</p>
        </div>
    </main>

    <!-- Modal: Item Registration -->
    <div id="registerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-lg">습득 분실물 등록</h3>
                <button type="button" onclick="window.closeRegisterModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="registerForm" class="p-6 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">분실물 사진 *</label>
                    <input type="file" id="regImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" required>
                    <div id="imgPreviewContainer" class="mt-2 hidden">
                        <img id="imgPreview" class="h-32 rounded-xl object-cover border border-slate-200" alt="미리보기">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">분실물 명칭 *</label>
                    <input type="text" id="regTitle" placeholder="예: 검은색 샤프, 에어팟 프로" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리 *</label>
                        <select id="regCategory" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="전자기기">전자기기</option>
                            <option value="의류/잡화">의류/잡화</option>
                            <option value="학용품/도서">학용품/도서</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">보관처 위치 *</label>
                        <select id="regKeeper" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="1학년 교무실">1학년 교무실</option>
                            <option value="2학년 교무실">2학년 교무실</option>
                            <option value="3학년 교무실">3학년 교무실</option>
                            <option value="본 교무실">본 교무실</option>
                            <option value="학생부">학생부</option>
                            <option value="행정실">행정실</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">습득 장소 *</label>
                    <input type="text" id="regLocation" placeholder="예: 2층 중앙계단 옆, 도서관" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호 4자리 (수령완료 처리용) *</label>
                    <input type="password" id="regPassword" maxlength="4" placeholder="숫자 4자리" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상세 특징 설명</label>
                    <textarea id="regDesc" rows="2" placeholder="색상, 고리 스티커 유무 등 상세 특징" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="window.closeRegisterModal()" class="px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-sm font-semibold">취소</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow">접수 등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Claim Verification -->
    <div id="claimModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 text-center">
            <h3 class="font-bold text-slate-800 text-lg mb-2">수령 완료 처리</h3>
            <p class="text-xs text-slate-500 mb-4">등록 시 설정했던 비밀번호 4자리를 입력해주세요.</p>
            <input type="password" id="claimPasswordInput" maxlength="4" onkeyup="if(event.key==='Enter') window.submitClaimItem()" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-center text-lg tracking-widest font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-4">
            <div class="flex space-x-2">
                <button type="button" onclick="window.closeClaimModal()" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-sm">취소</button>
                <button type="button" id="claimSubmitBtn" onclick="window.submitClaimItem()" class="w-1/2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow">확인</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transition-transform transform translate-y-32 opacity-0 duration-300">
        <div id="toastContent" class="bg-slate-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2">
            <span id="toastMsg">메시지 내용</span>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 📌 발급받으신 Firebase 데이터베이스 실제 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyDRhQicwd4uV1ZeMwVJaVEiqbKC1Ck41rU",
            authDomain: "school-lost-c2887.firebaseapp.com",
            projectId: "school-lost-c2887",
            storageBucket: "school-lost-c2887.firebasestorage.app",
            messagingSenderId: "886082223656",
            appId: "1:886082223656:web:fe1d6437c0580a1c327f1d",
            measurementId: "G-EH4MPLPTY9"
        };

        let db = null;
        let lostItemsColRef = null;
        let isFirebaseValid = false;
        let items = [];
        let uploadedImageBase64 = "";
        let selectedItemIdForClaim = null;
        let isSubmitting = false;

        // --- Helper: Local Storage Backup Management ---
        function getLocalItems() {
            try {
                const stored = localStorage.getItem('school_lost_items');
                return stored ? JSON.parse(stored) : [];
            } catch(e) {
                return [];
            }
        }

        function saveLocalItems(data) {
            try {
                localStorage.setItem('school_lost_items', JSON.stringify(data));
            } catch(e) {
                console.warn("LocalStorage save error", e);
            }
        }

        // --- Modal UI Handling Functions (Exposed to Window) ---
        window.openRegisterModal = function() {
            document.getElementById('registerModal').classList.remove('hidden');
        };

        window.closeRegisterModal = function() {
            document.getElementById('registerModal').classList.add('hidden');
            const form = document.getElementById('registerForm');
            if (form) form.reset();
            
            const previewContainer = document.getElementById('imgPreviewContainer');
            if (previewContainer) previewContainer.classList.add('hidden');
            
            const regImg = document.getElementById('regImage');
            if (regImg) regImg.value = "";
            uploadedImageBase64 = ""; 
            
            // 버튼 상태 강제 원상복구
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = "접수 등록하기";
            }
            isSubmitting = false;
        };

        window.openClaimModal = function(id) {
            selectedItemIdForClaim = id;
            document.getElementById('claimPasswordInput').value = "";
            document.getElementById('claimModal').classList.remove('hidden');
        };

        window.closeClaimModal = function() {
            selectedItemIdForClaim = null;
            document.getElementById('claimModal').classList.add('hidden');
        };

        // --- Global Render Function ---
        window.renderItems = function() {
            const grid = document.getElementById('itemsGrid');
            const emptyState = document.getElementById('emptyState');
            if (!grid) return;

            const search = (document.getElementById('searchInput')?.value || "").toLowerCase();
            const category = document.getElementById('categoryFilter')?.value || "all";
            const keeper = document.getElementById('keeperFilter')?.value || "all";

            const filtered = items.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(search) || 
                                    item.location.toLowerCase().includes(search) || 
                                    (item.desc && item.desc.toLowerCase().includes(search));
                const matchCat = category === "all" || item.category === category;
                const matchKeeper = keeper === "all" || item.keeper === keeper;
                return matchSearch && matchCat && matchKeeper;
            });

            if (filtered.length === 0) {
                grid.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => {
                const isClaimed = item.status === "claimed";
                return `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition duration-200 flex flex-col ${isClaimed ? 'opacity-70 grayscale-[30%]' : ''}">
                    <div class="relative aspect-video bg-slate-100 overflow-hidden">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        <!-- 카모플라쥬 뱃지 (필수 포함) -->
                        <div class="absolute top-2 left-2 bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-medium px-2 py-1 rounded-md">
                            이 분실물의 사진을 찾습니다
                        </div>
                        <span class="absolute top-2 right-2 px-2.5 py-1 rounded-full text-xs font-semibold ${isClaimed ? 'bg-slate-700 text-slate-100' : 'bg-emerald-500 text-white shadow-sm'}">
                            ${isClaimed ? '수령 완료' : '보관 중'}
                        </span>
                    </div>

                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                                <span class="font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${item.category}</span>
                                <span>${item.date || '오늘'}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-base leading-snug">${item.title}</h3>
                            ${item.desc ? `<p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.desc}</p>` : ''}
                        </div>

                        <div class="space-y-1.5 pt-2 border-t border-slate-100 text-xs">
                            <div class="flex items-center text-slate-600">
                                <i class="fa-solid fa-location-dot w-4 text-indigo-500"></i>
                                <span class="font-medium mr-1">습득:</span> ${item.location}
                            </div>
                            <div class="flex items-center text-slate-600">
                                <i class="fa-solid fa-building-user w-4 text-indigo-500"></i>
                                <span class="font-medium mr-1">보관:</span> <span class="font-bold text-indigo-600">${item.keeper}</span>
                            </div>
                        </div>

                        <div class="pt-2">
                            ${isClaimed ? `
                                <button disabled class="w-full py-2 bg-slate-100 text-slate-400 font-semibold rounded-xl text-xs cursor-not-allowed">
                                    <i class="fa-solid fa-circle-check mr-1"></i> 수령 완료됨
                                </button>
                            ` : `
                                <button onclick="window.openClaimModal('${item.id}')" class="w-full py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold border border-slate-200 rounded-xl text-xs transition">
                                    수령 처리 (작성자 전용)
                                </button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        };

        // --- Toast Notice ---
        window.showToast = function(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = message;
            if (isError) {
                toastContent.className = "bg-rose-600 text-white text-sm px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2";
            } else {
                toastContent.className = "bg-slate-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2";
            }
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3000);
        };

        // --- Registration Logic ---
        window.handleRegisterSubmit = async function() {
            if (isSubmitting) return;

            const submitBtn = document.getElementById('submitBtn');
            const title = document.getElementById('regTitle').value.trim();
            const category = document.getElementById('regCategory').value;
            const keeper = document.getElementById('regKeeper').value;
            const location = document.getElementById('regLocation').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const desc = document.getElementById('regDesc').value.trim();

            if (!title || !location || !password) {
                window.showToast("필수 항목[명칭, 장소, 비밀번호]을 작성해주세요.", true);
                return;
            }
            if (!uploadedImageBase64) {
                window.showToast("이미지를 첨부해주세요.", true);
                return;
            }

            isSubmitting = true;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerText = "등록 중...";
            }
            const today = new Date().toISOString().split('T')[0];

            const newItem = {
                title: title,
                category: category,
                keeper: keeper,
                location: location,
                password: password,
                date: today,
                timestamp: Date.now(),
                desc: desc,
                image: uploadedImageBase64,
                status: "unclaimed"
            };

            try {
                if (isFirebaseValid && db && lostItemsColRef) {
                    await addDoc(lostItemsColRef, newItem);
                } else {
                    newItem.id = 'item_' + Date.now();
                    items.unshift(newItem);
                    saveLocalItems(items);
                    window.renderItems();
                }
                window.showToast("새 분실물이 성공적으로 등록되었습니다!");
                window.closeRegisterModal();
            } catch (err) {
                console.error("Register Error:", err);
                window.showToast("등록 실패! 오류가 발생했습니다.", true);
            } finally {
                isSubmitting = false;
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "접수 등록하기";
                }
            }
        };

        // --- Claim Item Handler ---
        window.submitClaimItem = async function() {
            const pwdInput = document.getElementById('claimPasswordInput').value.trim();
            const claimBtn = document.getElementById('claimSubmitBtn');
            
            if (!selectedItemIdForClaim) {
                window.showToast("선택된 분실물 정보가 없습니다.", true);
                return;
            }

            if (!pwdInput) {
                window.showToast("비밀번호 4자리를 입력해주세요.", true);
                return;
            }

            const targetItem = items.find(i => String(i.id) === String(selectedItemIdForClaim));
            if (!targetItem) {
                window.showToast("해당 항목을 찾을 수 없습니다.", true);
                return;
            }

            if (String(targetItem.password) !== String(pwdInput)) {
                window.showToast("비밀번호가 일치하지 않습니다.", true);
                return;
            }

            if (claimBtn) {
                claimBtn.disabled = true;
                claimBtn.innerText = "처리 중...";
            }

            try {
                // 로컬 상태 먼저 즉시 업데이트하여 반응성 확보
                targetItem.status = "claimed";
                saveLocalItems(items);
                window.renderItems();

                // Firebase DB에도 업데이트 시도
                if (isFirebaseValid && db && !String(selectedItemIdForClaim).startsWith('item_')) {
                    const docRef = doc(db, "lost_items", String(selectedItemIdForClaim));
                    await updateDoc(docRef, { status: "claimed" });
                }

                window.showToast("수령 완료로 상태가 변경되었습니다!");
                window.closeClaimModal();
            } catch(e) {
                console.warn("Firebase Claim Update Warning:", e);
                // Firebase 권한 규칙 등으로 실패하더라도 로컬 상태는 이미 반영되었으므로 모달 닫기
                window.showToast("수령 완료 처리되었습니다.");
                window.closeClaimModal();
            } finally {
                if (claimBtn) {
                    claimBtn.disabled = false;
                    claimBtn.innerText = "확인";
                }
            }
        };

        // --- Initialize App & Firebase ---
        window.addEventListener('DOMContentLoaded', () => {
            // 새로고침 직후 저장된 데이터를 화면에 즉시 표시
            items = getLocalItems();
            window.renderItems();

            // Image Input Resize & Compression
            const regImageInput = document.getElementById('regImage');
            if (regImageInput) {
                regImageInput.addEventListener('change', function(e) {
                    const input = e.target;
                    if (input.files && input.files[0]) {
                        const file = input.files[0];
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const img = new Image();
                            img.onload = function() {
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                const MAX_WIDTH = 350;
                                const MAX_HEIGHT = 350;
                                let width = img.width;
                                let height = img.height;

                                if (width > height) {
                                    if (width > MAX_WIDTH) {
                                        height *= MAX_WIDTH / width;
                                        width = MAX_WIDTH;
                                    }
                                } else {
                                    if (height > MAX_HEIGHT) {
                                        width *= MAX_HEIGHT / height;
                                        height = MAX_HEIGHT;
                                    }
                                }
                                canvas.width = width;
                                canvas.height = height;
                                ctx.drawImage(img, 0, 0, width, height);
                                uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                                document.getElementById('imgPreview').src = uploadedImageBase64;
                                document.getElementById('imgPreviewContainer').classList.remove('hidden');
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // Form Submit Event Binding
            const regForm = document.getElementById('registerForm');
            if (regForm) {
                regForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    window.handleRegisterSubmit();
                });
            }

            // Load Firebase & Real-time Synchronization
            try {
                if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("YOUR_")) {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    db = getFirestore(app);
                    signInAnonymously(auth);

                    lostItemsColRef = collection(db, "lost_items");
                    onSnapshot(lostItemsColRef, (snapshot) => {
                        const firebaseItems = [];
                        snapshot.forEach((docSnap) => {
                            firebaseItems.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        firebaseItems.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        items = firebaseItems;
                        saveLocalItems(items); // 로컬 저장소에도 동기화 저장
                        window.renderItems();
                    }, (error) => {
                        console.warn("Firestore listener fallback:", error);
                        items = getLocalItems();
                        window.renderItems();
                    });
                    isFirebaseValid = true;
                } else {
                    throw new Error("No Firebase Config Key Provided");
                }
            } catch (err) {
                console.log("Fallback to LocalStorage mode:", err);
                isFirebaseValid = false;
                items = getLocalItems();
                window.renderItems();
            }
        });
    </script>
</body>
</html>
